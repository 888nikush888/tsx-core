services:
  forwarder:
    build:
      context: .
      dockerfile: Dockerfile
    # Local tags are development-only. Production must validate and pass both
    # independently released image digests with quality:deployment-images.
    image: ${FORWARDER_IMAGE:-tsx-core:local}
    init: true
    restart: unless-stopped
    stop_grace_period: 8m
    environment:
      WEB_HOST: "0.0.0.0"
      # Browser headers never establish identity. Direct loopback is trusted; Docker
      # first-run traffic instead requires the explicit one-time proof below.
      DASHBOARD_LOCAL_TRUST: "true"
      # Set this to a fresh random value before the first Compose bootstrap. The
      # UI consumes it once; it is not an administrator session or reusable login.
      DASHBOARD_BOOTSTRAP_PROOF: "${DASHBOARD_BOOTSTRAP_PROOF:-}"
      # Break-glass recovery requires direct loopback or a freshly supplied proof.
      DASHBOARD_RECOVERY_LOCAL_TRUST: "true"
      METRICS_HOST: "0.0.0.0"
      PORT: "8080"
      METRICS_PORT: "9100"
      BACKUP_DIR: "/app/backups"
      LOG_DIR: "/app/logs"
      CONFIG_PATH: "/app/config/config.json"
      RUNTIME_SETTINGS_PATH: "/app/config/runtime-settings.json"
      MANAGED_SECRET_DIR: "/app/secrets"
      TELEGRAM_VIEWER_SETTINGS_PATH: "/app/config/telegram-viewer-settings.json"
      TELEGRAM_VIEWER_SECRET_DIR: "/app/telegram_viewer_secrets"
      TELEGRAM_VIEWER_STATUS_URL: "http://telegram-viewer:8081/status"
      TEMPLATES_DIR: "/app/templates"
      EXCHANGE_EXECUTOR_URL: "http://exchange-executor:8090"
      # Browser-visible address of the independently gated MCP service.
      MCP_ENDPOINT_URL: "${MCP_ENDPOINT_URL:-http://127.0.0.1:8091/mcp}"
    volumes:
      - forwarder_config:/app/config
      - forwarder_secrets:/app/secrets
      - telegram_viewer_secrets:/app/telegram_viewer_secrets
      - forwarder_templates:/app/templates
      - forwarder_session_data:/app/session_data
      - forwarder_session_files:/app/session_files
      - forwarder_signals:/app/signals
      - forwarder_logs:/app/logs
      - forwarder_backups:/app/backups
    ports:
      # Tailscale Serve runs on the Docker host and proxies this loopback-only
      # port. Do not replace 127.0.0.1 with 0.0.0.0 and never enable Funnel.
      - "127.0.0.1:${HOST_WEB_PORT:-8080}:8080"
      - "127.0.0.1:${HOST_METRICS_PORT:-9100}:9100"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${FORWARDER_MEMORY_LIMIT:-1g}
    cpus: ${FORWARDER_CPU_LIMIT:-1.0}
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://127.0.0.1:9100/healthz',{signal:AbortSignal.timeout(4000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - core-network
      - viewer-network

  exchange-executor:
    build:
      context: ./exchange_executor
      dockerfile: Dockerfile
    image: ${EXCHANGE_EXECUTOR_IMAGE:-tsx-core-exchange-executor:local}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      EXECUTOR_HOST: "0.0.0.0"
      EXECUTOR_PORT: "8090"
      MANAGED_SECRET_DIR: "/app/secrets"
    volumes:
      - forwarder_secrets:/app/secrets:ro
    expose:
      - "8090"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: ${EXCHANGE_EXECUTOR_MEMORY_LIMIT:-384m}
    cpus: ${EXCHANGE_EXECUTOR_CPU_LIMIT:-0.5}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=4).read()"
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - core-network

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${FORWARDER_IMAGE:-tsx-core:local}
    command: ["dist/mcp_server.js"]
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      forwarder:
        condition: service_healthy
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8091"
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1,mcp-server}"
      MCP_ALLOWED_ORIGINS: "${MCP_ALLOWED_ORIGINS:-}"
      MCP_RUNTIME_POLL_MS: "${MCP_RUNTIME_POLL_MS:-500}"
      FORWARDER_DB_PATH: "/app/session_data/forwarder.db"
    volumes:
      - forwarder_session_data:/app/session_data
    ports:
      # Loopback-only. Tailscale Serve may publish this inside the tailnet;
      # never use Funnel for the MCP endpoint.
      - "127.0.0.1:${HOST_MCP_PORT:-8091}:8091"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: ${MCP_MEMORY_LIMIT:-384m}
    cpus: ${MCP_CPU_LIMIT:-0.5}
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://127.0.0.1:8091/healthz',{signal:AbortSignal.timeout(4000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - core-network

  telegram-viewer:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${FORWARDER_IMAGE:-tsx-core:local}
    command: ["dist/telegram_viewer/runtime.js"]
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      forwarder:
        condition: service_healthy
    environment:
      TELEGRAM_VIEWER_CORE_URL: "http://forwarder:8080"
      TELEGRAM_VIEWER_SECRET_DIR: "/app/secrets"
      TELEGRAM_VIEWER_STATE_DB: "/app/state/viewer_state.db"
      TELEGRAM_VIEWER_HEALTH_PORT: "8081"
    volumes:
      - telegram_viewer_secrets:/app/secrets:ro
      - telegram_viewer_state:/app/state
    expose:
      - "8081"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: ${TELEGRAM_VIEWER_MEMORY_LIMIT:-256m}
    cpus: ${TELEGRAM_VIEWER_CPU_LIMIT:-0.25}
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://127.0.0.1:8081/healthz',{signal:AbortSignal.timeout(4000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - viewer-network

volumes:
  forwarder_config:
  forwarder_secrets:
  forwarder_templates:
  forwarder_session_data:
  forwarder_session_files:
  forwarder_signals:
  forwarder_logs:
  forwarder_backups:
  telegram_viewer_secrets:
  telegram_viewer_state:

networks:
  core-network:
  viewer-network:
