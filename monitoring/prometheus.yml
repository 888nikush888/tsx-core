global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: tsx-core
    scheme: https
    metrics_path: /metrics
    tls_config:
      ca_file: /run/tsx-tls/ca.pem
    static_configs:
      - targets: [forwarder:9100]
