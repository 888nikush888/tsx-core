route:
  receiver: enterprise-incident-webhook
  group_by: [alertname, severity, service]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 30m

receivers:
  - name: enterprise-incident-webhook
    webhook_configs:
      - url: https://alert-relay:9095/alerts
        send_resolved: true
        max_alerts: 100
        http_config:
          tls_config:
            ca_file: /run/tsx-tls/ca.pem
          authorization:
            type: Bearer
            credentials_file: /app/secrets/alert_relay_token
