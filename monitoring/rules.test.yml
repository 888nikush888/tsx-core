rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'tg_forwarder_outbox_tasks{status="unknown"}'
        values: '0 1 1'
      - series: 'tg_forwarder_backup_healthy'
        values: '1 0 0'
      - series: 'tg_forwarder_backup_offsite_healthy'
        values: '1 1 1'
      - series: 'tg_forwarder_audit_healthy'
        values: '1 0 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: ForwarderUnknownDelivery
        exp_alerts:
          - exp_labels:
              severity: critical
              service: telegram-forwarder
            exp_annotations:
              summary: A Telegram delivery has an unknown outcome
              runbook: docs/runbooks/operations.md#unknown-zustellung
      - eval_time: 2m
        alertname: ForwarderBackupUnhealthy
        exp_alerts:
          - exp_labels:
              severity: critical
              service: telegram-forwarder
            exp_annotations:
              summary: Local or off-host backup verification is unhealthy
              runbook: docs/runbooks/operations.md#backup-restore-und-rollback
      - eval_time: 2m
        alertname: ForwarderAuditTrailUnhealthy
        exp_alerts:
          - exp_labels:
              severity: critical
              service: telegram-forwarder
            exp_annotations:
              summary: Control-plane audit persistence or remote delivery is unhealthy
              runbook: docs/runbooks/operations.md#audit-trail-ausfall

  - interval: 1m
    input_series:
      - series: 'tg_forwarder_delivery_attempts_total'
        values: '0+10x25'
      - series: 'tg_forwarder_delivery_confirmed_total'
        values: '0+0x25'
      - series: 'tg_forwarder_delivery_latency_seconds_bucket{le="60"}'
        values: '0+0x25'
      - series: 'tg_forwarder_delivery_latency_seconds_bucket{le="120"}'
        values: '0+10x25'
      - series: 'tg_forwarder_delivery_latency_seconds_bucket{le="+Inf"}'
        values: '0+10x25'
      - series: 'tg_forwarder_delivery_latency_seconds_count'
        values: '0+10x25'
    alert_rule_test:
      - eval_time: 20m
        alertname: ForwarderDeliverySuccessSloBurn
        exp_alerts:
          - exp_labels:
              severity: high
              service: telegram-forwarder
            exp_annotations:
              summary: Confirmed delivery success is below the 99.5 percent SLO
              runbook: docs/runbooks/operations.md#alarm-triage
      - eval_time: 20m
        alertname: ForwarderDeliveryLatencySloBurn
        exp_alerts:
          - exp_labels:
              severity: high
              service: telegram-forwarder
            exp_annotations:
              summary: Accepted-to-confirmed delivery P95 exceeds 60 seconds
              runbook: docs/runbooks/operations.md#alarm-triage
