services:
  prometheus:
    image: prom/prometheus:v3.13.2-distroless@sha256:64f71bb84e03c855948418b0fc5dea53e9543d8e3fc9931598f583805507f05e
    working_dir: /etc/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=8GB
    restart: on-failure:3
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - 127.0.0.1:${HOST_PROMETHEUS_PORT:-9090}:9090
    depends_on:
      - alertmanager

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-tsx-core-alertmanager:0.33.1-hardened}
    build:
      context: .
      dockerfile: monitoring/alertmanager.Dockerfile
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --data.retention=120h
    restart: on-failure:3
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
      - forwarder_secrets:/app/secrets:ro
    ports:
      - 127.0.0.1:${HOST_ALERTMANAGER_PORT:-9093}:9093
    depends_on:
      - alert-relay

  alert-relay:
    image: ${FORWARDER_IMAGE:-tsx-core:local}
    command: [dist/alert_relay.js]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.25
    environment:
      ALERT_RELAY_TOKEN_FILE: /app/secrets/alert_relay_token
      ALERT_WEBHOOK_TOKEN_FILE: /app/secrets/alert_webhook_token
      RUNTIME_SETTINGS_PATH: /app/config/runtime-settings.json
    volumes:
      - forwarder_secrets:/app/secrets:ro
      - forwarder_config:/app/config:ro

volumes:
  prometheus_data:
  alertmanager_data:
  forwarder_config:
  forwarder_secrets:
