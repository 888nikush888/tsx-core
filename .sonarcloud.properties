# SonarQube Cloud automatic-analysis configuration.
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Keep production and test scopes disjoint so test-specific rules are applied.
sonar.sources=.
sonar.tests=tests,frontend/tests,frontend/e2e,exchange_executor/tests,monitoring/rules.test.yml
sonar.exclusions=tests/**,frontend/tests/**,frontend/e2e/**,exchange_executor/tests/**,monitoring/rules.test.yml
