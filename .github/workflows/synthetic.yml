name: Staging Synthetic Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-synthetic
  cancel-in-progress: true

jobs:
  telegram-e2e:
    runs-on: [self-hosted, staging]
    environment: staging
    timeout-minutes: 12
    env:
      NON_INTERACTIVE: 'true'
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      E2E_SOURCE_CHAT_ID: ${{ vars.E2E_SOURCE_CHAT_ID }}
      E2E_TARGET_CHAT_ID: ${{ vars.E2E_TARGET_CHAT_ID }}
      E2E_TDL_DATABASE_DIR: ${{ vars.E2E_TDL_DATABASE_DIR }}
      E2E_TDL_FILES_DIR: ${{ vars.E2E_TDL_FILES_DIR }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:staging-e2e
      - name: Upload synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-evidence-${{ github.sha }}-${{ github.run_id }}
          path: reports/staging/
          if-no-files-found: error
          retention-days: 90
