name: Staging Synthetic Monitor

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-synthetic
  cancel-in-progress: true

jobs:
  telegram-e2e:
    runs-on: [self-hosted, staging]
    environment: staging
    timeout-minutes: 12
    env:
      NON_INTERACTIVE: 'true'
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      E2E_SOURCE_CHAT_ID: ${{ vars.E2E_SOURCE_CHAT_ID }}
      E2E_TARGET_CHAT_ID: ${{ vars.E2E_TARGET_CHAT_ID }}
      E2E_TDL_DATABASE_DIR: ${{ vars.E2E_TDL_DATABASE_DIR }}
      E2E_TDL_FILES_DIR: ${{ vars.E2E_TDL_FILES_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild sqlite3 --build-from-source
      - run: npm run test:staging-e2e
      - name: Upload synthetic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: synthetic-evidence-${{ github.sha }}-${{ github.run_id }}
          path: reports/staging/
          if-no-files-found: error
          retention-days: 90
