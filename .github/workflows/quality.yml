name: Quality OS

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  verify:
    name: Lint, tests, coverage, build, supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Configure pinned Node major
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
      - name: Dependency vulnerability gates
        run: |
          npm audit --audit-level=moderate
          npm audit --prefix frontend --audit-level=moderate
      - name: License policy gate
        run: npm run quality:licenses
      - name: Calculate evidence-based PR risk
        if: github.event_name == 'pull_request'
        run: node scripts/calculate_pr_risk.js "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - name: Static and type gates
        run: |
          npm run lint
          npm run lint:frontend
          npm run typecheck
          npm run quality:architecture
          npm run quality:complexity
          npm run quality:frontend
          npm run quality:release
          npm run quality:risk-acceptances
          npm run quality:monitoring
      - name: Test and per-file coverage gate
        run: |
          npm run test:coverage
          npm run test:coverage:modules
      - name: Duplicate ratio gate
        run: npm run quality:duplicates
      - name: Reproducible build
        run: npm run build
      - name: Generate CycloneDX SBOMs
        run: npm run quality:sbom
      - name: Upload verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-evidence-${{ github.sha }}
          path: |
            coverage/
            coverage-modules/
            reports/
          if-no-files-found: error
          retention-days: 90

  mutation:
    name: Critical mutation gate (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [queue, retry, schema]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Restore mutation baseline
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: reports/stryker-${{ matrix.shard }}-incremental.json
          key: stryker-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('src/queue.ts', 'src/tdlib_retry.ts', 'src/signal_schema.ts', 'tests/test_queue.js', 'tests/test_tdlib_retry.js', 'tests/test_signal_parser.js', 'stryker.config.mjs', 'scripts/run_mutation_shards.js') }}
          restore-keys: stryker-${{ matrix.shard }}-${{ runner.os }}-
      - run: npm ci --no-audit --no-fund
      - run: npm run test:mutation -- ${{ matrix.shard }}
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutation-evidence-${{ matrix.shard }}-${{ github.sha }}
          path: |
            reports/mutation/${{ matrix.shard }}.json
            reports/stryker-${{ matrix.shard }}-incremental.json
          if-no-files-found: error
          retention-days: 90

  sast:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: github/codeql-action/init@641a925cfafe92d0fdf8b239ba4053e3f8d99d6d
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@641a925cfafe92d0fdf8b239ba4053e3f8d99d6d

  secrets:
    name: Secret history scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate

  container:
    name: Container build, SBOM, vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build immutable candidate
        run: docker build --tag telegram-tdlib-forwarder:${{ github.sha }} .
      - name: Verify runtime native modules and non-root user
        run: |
          test "$(docker image inspect telegram-tdlib-forwarder:${{ github.sha }} --format '{{.Config.User}}')" = node
          docker run --rm --entrypoint node telegram-tdlib-forwarder:${{ github.sha }} -e "Promise.all([import('sqlite3'),import('tdl'),import('prebuilt-tdlib')]).then(()=>console.log('native-import-ok')).catch(error=>{console.error(error);process.exit(1)})"
      - name: Generate container SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          version: v0.69.3
          image-ref: telegram-tdlib-forwarder:${{ github.sha }}
          format: cyclonedx
          output: container.cdx.json
          exit-code: '0'
      - name: Block high and critical container vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          version: v0.69.3
          image-ref: telegram-tdlib-forwarder:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Generate Prometheus SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          version: v0.69.3
          image-ref: prom/prometheus:v3.13.0-distroless@sha256:f3b6aae627d96e7ad8256cdf6de5953247735117c6f577383fadb42efeeea7bc
          format: cyclonedx
          output: prometheus.cdx.json
          exit-code: '0'
      - name: Block Prometheus high and critical vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          version: v0.69.3
          image-ref: prom/prometheus:v3.13.0-distroless@sha256:f3b6aae627d96e7ad8256cdf6de5953247735117c6f577383fadb42efeeea7bc
          format: sarif
          output: prometheus-trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Generate Alertmanager SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          version: v0.69.3
          image-ref: prom/alertmanager:v0.32.1@sha256:51a825c2a40acc3e338fdd00d622e01ec090f72be2b3ea46be0839cd47a4d286
          format: cyclonedx
          output: alertmanager.cdx.json
          exit-code: '0'
      - name: Block Alertmanager high and critical vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          version: v0.69.3
          image-ref: prom/alertmanager:v0.32.1@sha256:51a825c2a40acc3e338fdd00d622e01ec090f72be2b3ea46be0839cd47a4d286
          format: sarif
          output: alertmanager-trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Preserve the scanned release candidate
        if: startsWith(github.ref, 'refs/tags/v')
        run: docker save telegram-tdlib-forwarder:${{ github.sha }} | zstd -T0 -3 -o release-image.tar.zst
      - name: Upload release candidate
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-image-${{ github.sha }}
          path: release-image.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: container-evidence-${{ github.sha }}
          path: |
            container.cdx.json
            trivy.sarif
            prometheus.cdx.json
            prometheus-trivy.sarif
            alertmanager.cdx.json
            alertmanager-trivy.sarif
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish attested immutable release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, mutation, sast, secrets, container]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Checkout the exact release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Verify repository governance controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify_github_governance.js
      - name: Require repository release immutability
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/immutable-releases" >/dev/null
      - name: Require successful staging and 30-day evidence for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in staging.yml production_evidence.yml; do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${GITHUB_SHA}&status=success&per_page=1" --jq '.total_count')"
            test "${count}" -ge 1 || { echo "No successful ${workflow} run exists for ${GITHUB_SHA}." >&2; exit 1; }
          done
      - name: Require tag and package versions to match
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - name: Download scanned image candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: release-image-${{ github.sha }}
          path: release-candidate
      - name: Download application SBOM evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: quality-evidence-${{ github.sha }}
          path: application-evidence
      - name: Download container scan evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: container-evidence-${{ github.sha }}
          path: container-evidence
      - name: Load, publish and identify the scanned image
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zstd -dc release-candidate/release-image.tar.zst | docker load
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "telegram-tdlib-forwarder:${GITHUB_SHA}" "${image_name}:${GITHUB_REF_NAME}"
          docker tag "telegram-tdlib-forwarder:${GITHUB_SHA}" "${image_name}:sha-${GITHUB_SHA}"
          docker push "${image_name}:${GITHUB_REF_NAME}"
          docker push "${image_name}:sha-${GITHUB_SHA}"
          published_ref="$(docker inspect --format '{{index .RepoDigests 0}}' "${image_name}:${GITHUB_REF_NAME}")"
          test "${published_ref}" != '<no value>'
          echo "image-name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "image-digest=${published_ref#*@}" >> "$GITHUB_OUTPUT"
      - name: Attest image build provenance
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999
        with:
          subject-name: ${{ steps.publish.outputs.image-name }}
          subject-digest: ${{ steps.publish.outputs.image-digest }}
          push-to-registry: true
      - name: Attest the container SBOM
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999
        with:
          subject-name: ${{ steps.publish.outputs.image-name }}
          subject-digest: ${{ steps.publish.outputs.image-digest }}
          sbom-path: container-evidence/container.cdx.json
          push-to-registry: true
      - name: Assemble signed release evidence
        env:
          IMAGE_NAME: ${{ steps.publish.outputs.image-name }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.image-digest }}
        run: |
          mkdir release-assets
          cp application-evidence/reports/sbom/backend.cdx.json release-assets/backend.cdx.json
          cp application-evidence/reports/sbom/frontend.cdx.json release-assets/frontend.cdx.json
          cp container-evidence/container.cdx.json release-assets/container.cdx.json
          cp container-evidence/trivy.sarif release-assets/trivy.sarif
          cp container-evidence/prometheus.cdx.json release-assets/prometheus.cdx.json
          cp container-evidence/prometheus-trivy.sarif release-assets/prometheus-trivy.sarif
          cp container-evidence/alertmanager.cdx.json release-assets/alertmanager.cdx.json
          cp container-evidence/alertmanager-trivy.sarif release-assets/alertmanager-trivy.sarif
          cp reports/governance/github-governance.json release-assets/github-governance.json
          sha256sum release-assets/* > release-assets/SHA256SUMS
          jq -n \
            --arg tag "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            --arg image "$IMAGE_NAME" \
            --arg digest "$IMAGE_DIGEST" \
            '{schemaVersion:1, tag:$tag, commit:$commit, image:$image, digest:$digest}' \
            > release-assets/release-manifest.json
      - name: Publish release with all assets atomically
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/*
          --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
      - name: Verify immutable release and published attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release verify "$GITHUB_REF_NAME"
          gh attestation verify "oci://${{ steps.publish.outputs.image-name }}@${{ steps.publish.outputs.image-digest }}" --repo "$GITHUB_REPOSITORY"
