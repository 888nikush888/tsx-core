name: Quality OS

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Lint, tests, coverage, build, supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Configure pinned Node major
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Configure pinned Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            exchange_executor/requirements.lock
            exchange_executor/requirements-dev.lock
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild sqlite3 --build-from-source
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm rebuild --prefix frontend esbuild
          python -m pip install --require-hashes -r exchange_executor/requirements.lock -r exchange_executor/requirements-dev.lock
      - name: Dependency vulnerability gates
        run: |
          npm audit --audit-level=moderate
          npm audit --prefix frontend --audit-level=moderate
      - name: License policy gate
        run: |
          npm run quality:licenses
          npm run quality:dependencies
      - name: Static and type gates
        run: |
          npm run lint
          npm run lint:frontend
          npm run typecheck
          npm run quality:architecture
          npm run quality:complexity
          npm run quality:frontend
          npm run quality:release
          npm run quality:risk-acceptances
          npm run quality:monitoring
          npm run quality:build-context
      - name: Test and per-file coverage gate
        run: |
          npm run test:coverage
          npm run test:coverage:modules
          python -m coverage run --branch --source=exchange_executor -m unittest discover -s exchange_executor/tests -v
          python -m coverage report --fail-under=60
          python -m coverage xml -o exchange_executor/coverage.xml
      - name: Duplicate ratio gate
        run: npm run quality:duplicates
      - name: Reproducible build
        run: npm run build
      - name: Generate CycloneDX SBOMs
        run: npm run quality:sbom
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-evidence-${{ github.sha }}
          path: |
            coverage/
            coverage-modules/
            reports/
          if-no-files-found: error
          retention-days: 90

  sonarcloud:
    name: SonarQube Cloud quality gate
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Prove scanner input revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Configure pinned Node major
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Configure pinned Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            exchange_executor/requirements.lock
            exchange_executor/requirements-dev.lock
      - name: Install locked analysis dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild sqlite3 --build-from-source
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm rebuild --prefix frontend esbuild
          python -m pip install --require-hashes -r exchange_executor/requirements.lock -r exchange_executor/requirements-dev.lock
      - name: Produce JavaScript and TypeScript coverage
        run: |
          ./node_modules/.bin/c8 --all --include="src/**/*.ts" --include="scripts/**/*.js" --exclude="src/*_cli.ts" --reporter=lcov --reports-dir=coverage node tests/run_all.js
          npm run test:coverage --prefix frontend
      - name: Produce Python coverage
        working-directory: exchange_executor
        run: |
          python -m coverage run --branch --source=. -m unittest discover -s tests -v
          python -m coverage xml -o coverage.xml
      - name: Analyze exact revision and wait for Quality Gate
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.scm.revision=${{ github.sha }}
      - name: Export issues and Security Hotspots for this revision
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: 888nikush888_telegram-tdlib-forwarder-private
          SONAR_BRANCH: main
          SONAR_EXPECTED_REVISION: ${{ github.sha }}
        run: |
          npm run quality:sonar-export
          jq --exit-status '.revisionMatchesExpectation == true and .qualityGate.status == "OK" and .toReviewHotspotCount == 0 and .blockerOrCriticalIssueCount == 0' reports/sonarcloud/summary.json
      - name: Upload SonarQube Cloud evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sonarcloud-evidence-${{ github.sha }}
          path: |
            reports/sonarcloud/
            coverage/lcov.info
            frontend/coverage/lcov.info
            exchange_executor/coverage.xml
          if-no-files-found: warn
          retention-days: 90

  mutation:
    name: Critical mutation gate (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [queue, retry, schema, trading-risk]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Restore mutation baseline
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: reports/stryker-${{ matrix.shard }}*-incremental.json
          key: stryker-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('src/queue.ts', 'src/tdlib_retry.ts', 'src/signal_schema.ts', 'src/trading_risk.ts', 'tests/test_queue.js', 'tests/test_tdlib_retry.js', 'tests/test_signal_parser.js', 'tests/test_trading_core.js', 'stryker.config.mjs', 'scripts/run_mutation_shards.js') }}
          restore-keys: stryker-${{ matrix.shard }}-${{ runner.os }}-
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild sqlite3 --build-from-source
      - run: npm run test:mutation -- ${{ matrix.shard }}
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mutation-evidence-${{ matrix.shard }}-${{ github.sha }}
          path: |
            reports/mutation/${{ matrix.shard }}.json
            reports/stryker-${{ matrix.shard }}*-incremental.json
          if-no-files-found: error
          retention-days: 90

  browser:
    name: Browser and accessibility gate (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chromium]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild esbuild
        working-directory: frontend
      - name: Install the pinned browser runtime
        run: npx playwright install --with-deps ${{ matrix.project == 'mobile-chromium' && 'chromium' || matrix.project }}
        working-directory: frontend
      - name: Run real-browser and WCAG A/AA checks
        run: npx playwright test --project=${{ matrix.project }}
        working-directory: frontend
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-evidence-${{ matrix.project }}-${{ github.sha }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 30

  sast:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          languages: javascript-typescript,python
      - name: Analyze without the unavailable private-repository upload
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          upload: never
          output: codeql-results
      - name: Block every CodeQL finding
        run: jq --slurp --exit-status '[.[].runs[]?.results[]?] | length == 0' codeql-results/*.sarif
      - name: Upload CodeQL evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codeql-evidence-${{ github.sha }}
          path: codeql-results/
          if-no-files-found: error
          retention-days: 90

  secrets:
    name: Secret history scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Review the dependency-graph diff when GitHub provides it
        if: github.event.repository.private == false
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate
      - name: Configure pinned Node for the private-repository fallback
        if: github.event.repository.private
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Enforce private-repository dependency evidence
        if: github.event.repository.private
        run: |
          npm audit --audit-level=moderate
          npm audit --prefix frontend --audit-level=moderate
          npm run quality:dependencies

  container:
    name: Container build, SBOM, vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure pinned Buildx builder
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Build immutable candidate
        run: docker build --tag tsx-core:${{ github.sha }} .
      - name: Build official exchange executor
        run: docker build --tag tsx-core-exchange-executor:${{ github.sha }} exchange_executor
      - name: Build hardened Prometheus
        run: docker buildx build --provenance=false --platform linux/amd64 --load --file monitoring/prometheus.Dockerfile --tag tsx-core-prometheus:${{ github.sha }} .
      - name: Build hardened Alertmanager for both release platforms
        run: |
          docker buildx build --provenance=false --platform linux/amd64 --load --metadata-file alertmanager-amd64-build.json --file monitoring/alertmanager.Dockerfile --tag tsx-core-alertmanager:${{ github.sha }}-amd64 .
          docker buildx build --provenance=false --platform linux/arm64 --load --metadata-file alertmanager-arm64-build.json --file monitoring/alertmanager.Dockerfile --tag tsx-core-alertmanager:${{ github.sha }}-arm64 .
      - name: Rebuild Alertmanager without cache and require the same digest
        run: |
          docker buildx build --no-cache --provenance=false --platform linux/amd64 --load --metadata-file alertmanager-amd64-rebuild.json --file monitoring/alertmanager.Dockerfile --tag tsx-core-alertmanager:${{ github.sha }}-repro .
          test "$(jq -er '."containerimage.digest"' alertmanager-amd64-build.json)" = "$(jq -er '."containerimage.digest"' alertmanager-amd64-rebuild.json)"
          docker image rm tsx-core-alertmanager:${{ github.sha }}-repro
      - name: Prove Alertmanager source and binary reachability for both platforms
        run: |
          docker buildx build --provenance=false --platform linux/amd64 --target security-audit --build-arg VULN_DB_EPOCH=${{ github.run_id }}-${{ github.run_attempt }} --file monitoring/alertmanager.Dockerfile .
          docker buildx build --provenance=false --platform linux/arm64 --target security-audit --build-arg VULN_DB_EPOCH=${{ github.run_id }}-${{ github.run_attempt }} --file monitoring/alertmanager.Dockerfile .
      - name: Prove Prometheus source and binary reachability
        run: docker buildx build --provenance=false --platform linux/amd64 --target security-audit --build-arg VULN_DB_EPOCH=${{ github.run_id }}-${{ github.run_attempt }} --file monitoring/prometheus.Dockerfile .
      - name: Verify runtime native modules and non-root user
        run: |
          test "$(docker image inspect tsx-core:${{ github.sha }} --format '{{.Config.User}}')" = 65532:65532
          docker run --rm --entrypoint /nodejs/bin/node tsx-core:${{ github.sha }} -e "Promise.all([import('sqlite3'),import('tdl'),import('prebuilt-tdlib')]).then(()=>console.log('native-import-ok')).catch(error=>{console.error(error);process.exit(1)})"
          test "$(docker image inspect tsx-core-exchange-executor:${{ github.sha }} --format '{{.Config.User}}')" = 65532:65532
          docker run --rm --entrypoint python tsx-core-exchange-executor:${{ github.sha }} -c "from importlib.metadata import version; import ccxt.async_support, ccxt.pro; assert version('ccxt') == '4.5.75'"
          docker run --rm -e PYTHONPATH=/app -v "$PWD/exchange_executor/tests:/tests:ro" --entrypoint python tsx-core-exchange-executor:${{ github.sha }} -m unittest discover -s /tests -v
          test "$(docker image inspect tsx-core-prometheus:${{ github.sha }} --format '{{.Architecture}}/{{.Config.User}}')" = amd64/65534:65534
          docker run --rm --entrypoint /usr/bin/prometheus tsx-core-prometheus:${{ github.sha }} --version
          docker run --rm --entrypoint /usr/bin/promtool tsx-core-prometheus:${{ github.sha }} --version
          test "$(docker image inspect tsx-core-alertmanager:${{ github.sha }}-amd64 --format '{{.Architecture}}/{{.Config.User}}')" = amd64/65534:65534
          test "$(docker image inspect tsx-core-alertmanager:${{ github.sha }}-arm64 --format '{{.Architecture}}/{{.Config.User}}')" = arm64/65534:65534
          docker run --rm --entrypoint /bin/alertmanager tsx-core-alertmanager:${{ github.sha }}-amd64 --version
          docker run --rm --entrypoint /bin/amtool tsx-core-alertmanager:${{ github.sha }}-amd64 --version
          docker run --rm --entrypoint /bin/amtool tsx-core-alertmanager:${{ github.sha }}-amd64 check-config /etc/alertmanager/alertmanager.yml
      - name: Generate container SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          image-ref: tsx-core:${{ github.sha }}
          format: cyclonedx
          output: container.cdx.json
          exit-code: '0'
      - name: Block high and critical container vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_VEX: security/vex/CVE-2026-14456.openvex.json
          TRIVY_SHOW_SUPPRESSED: true
        with:
          version: v0.70.0
          image-ref: tsx-core:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: '1'
      - name: Generate exchange executor SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          image-ref: tsx-core-exchange-executor:${{ github.sha }}
          format: cyclonedx
          output: exchange-executor.cdx.json
          exit-code: '0'
      - name: Block exchange executor high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          image-ref: tsx-core-exchange-executor:${{ github.sha }}
          format: sarif
          output: exchange-executor-trivy.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: '1'
      - name: Generate Prometheus SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          image-ref: tsx-core-prometheus:${{ github.sha }}
          format: cyclonedx
          output: prometheus.cdx.json
          exit-code: '0'
      - name: Block Prometheus high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          image-ref: tsx-core-prometheus:${{ github.sha }}
          format: sarif
          output: prometheus-trivy.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: '1'
      - name: Generate Alertmanager amd64 SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          image-ref: tsx-core-alertmanager:${{ github.sha }}-amd64
          format: cyclonedx
          output: alertmanager-amd64.cdx.json
          exit-code: '0'
      - name: Block Alertmanager amd64 high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          image-ref: tsx-core-alertmanager:${{ github.sha }}-amd64
          format: sarif
          output: alertmanager-amd64-trivy.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: '1'
      - name: Generate Alertmanager arm64 SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          image-ref: tsx-core-alertmanager:${{ github.sha }}-arm64
          format: cyclonedx
          output: alertmanager-arm64.cdx.json
          exit-code: '0'
      - name: Block Alertmanager arm64 high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          image-ref: tsx-core-alertmanager:${{ github.sha }}-arm64
          format: sarif
          output: alertmanager-arm64-trivy.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: '1'
      - name: Preserve the scanned release candidate
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker save tsx-core:${{ github.sha }} | zstd -T0 -3 -o release-image.tar.zst
          docker save tsx-core-exchange-executor:${{ github.sha }} | zstd -T0 -3 -o release-executor-image.tar.zst
          docker save tsx-core-alertmanager:${{ github.sha }}-amd64 | zstd -T0 -3 -o release-alertmanager-amd64-image.tar.zst
          docker save tsx-core-alertmanager:${{ github.sha }}-arm64 | zstd -T0 -3 -o release-alertmanager-arm64-image.tar.zst
      - name: Upload release candidate
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-image-${{ github.sha }}
          path: |
            release-image.tar.zst
            release-executor-image.tar.zst
            release-alertmanager-amd64-image.tar.zst
            release-alertmanager-arm64-image.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: container-evidence-${{ github.sha }}
          path: |
            container.cdx.json
            trivy.sarif
            exchange-executor.cdx.json
            exchange-executor-trivy.sarif
            prometheus.cdx.json
            prometheus-trivy.sarif
            alertmanager-amd64.cdx.json
            alertmanager-amd64-trivy.sarif
            alertmanager-arm64.cdx.json
            alertmanager-arm64-trivy.sarif
            alertmanager-amd64-build.json
            alertmanager-amd64-rebuild.json
            alertmanager-arm64-build.json
          if-no-files-found: error
          retention-days: 90
